    paths:
      - ".github/workflows/keepalive.yml"   # menyimpan berkas ini otomatis menjalankan uji coba
  schedule:
    - cron: "0 2 * * *"                     # tiap hari pukul 10.00 WITA
  workflow_dispatch:                        # tombol "Run workflow" (jika tersedia)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil database Supabase
        run: |
          curl -fsS -X POST "https://vlfnorubqnuecdysdqco.supabase.co/rest/v1/rpc/ambil_kelas" \
            -H "apikey: sb_publishable_17JU7KoQ_FYDdDggrgRnHw_jN4LFMYK" \
            -H "Content-Type: application/json" \
            -d '{"p_kode":"PING"}'
